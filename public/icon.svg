<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="3" opacity="0.4"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Speaker Cone / Soundwave Design -->
  <circle cx="256" cy="256" r="120" fill="#090d16" stroke="url(#accent)" stroke-width="12"/>
  <circle cx="256" cy="256" r="68" fill="#1e293b" stroke="#f59e0b" stroke-width="6"/>
  <circle cx="256" cy="256" r="32" fill="url(#accent)"/>

  <!-- Audio Waveform Equalizer Bars -->
  <rect x="130" y="230" width="10" height="52" rx="5" fill="url(#cyanGrad)"/>
  <rect x="150" y="210" width="10" height="92" rx="5" fill="url(#cyanGrad)"/>
  <rect x="170" y="240" width="10" height="32" rx="5" fill="url(#cyanGrad)"/>
  <rect x="332" y="240" width="10" height="32" rx="5" fill="url(#cyanGrad)"/>
  <rect x="352" y="210" width="10" height="92" rx="5" fill="url(#cyanGrad)"/>
  <rect x="372" y="230" width="10" height="52" rx="5" fill="url(#cyanGrad)"/>

  <!-- Headphone Arc -->
  <path d="M 120 270 A 136 136 0 0 1 392 270" fill="none" stroke="#94a3b8" stroke-width="14" stroke-linecap="round"/>
  <rect x="108" y="260" width="24" height="50" rx="8" fill="#cbd5e1"/>
  <rect x="380" y="260" width="24" height="50" rx="8" fill="#cbd5e1"/>

  <!-- Subtitle Arabic text -->
  <text x="256" y="440" font-family="Cairo, sans-serif" font-weight="bold" font-size="28" fill="#f8fafc" text-anchor="middle" letter-spacing="1">عالم الصوت والإلكترونيات</text>
</svg>
